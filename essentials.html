/* Layout: logo bar, pastel hero flanked by the two foot mascots, sticky filter strip (boys/girls, age, in stock), New Arrivals grid then All Clothes grid, contact block with poster and parent mascots. Single light look, matching the brand's printed materials. */
:root{

  --bg:#fffafc; --surface:#ffffff; --fg:#2b2d42; --muted:#6e7089; --line:#f1dfe8;

  --body:"Nunito",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:1140px;margin:0 auto;padding-inline:16px;padding-block:0}

.btn{font:inherit;font-weight:700;font-size:.92rem;border-radius:999px;padding:10px 18px;border:2px solid var(--fg);background:var(--surface);color:var(--fg);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}

.btn.blue{background:var(--blue-deep);border-color:var(--blue-deep);color:#fff}
.btn.wa{background:#6FC79A;border-color:#6FC79A;color:#fff}

.btn.danger{border-color:var(--danger);color:var(--danger);background:var(--surface)}
.btn.sm{font-size:.82rem;padding:6px 12px}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,.seg button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px}
.bar img{height:58px;width:auto;display:block}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:28px;background:
  radial-gradient(60% 80% at 0% 0%, var(--pink-soft) 0 60%, transparent 61%),
  radial-gradient(55% 75% at 100% 0%, var(--blue-soft) 0 60%, transparent 61%), var(--surface);
  border:1px solid var(--line);display:grid;grid-template-columns:150px 1fr 150px;align-items:end;gap:12px;padding:28px 20px 0}

/* thank-you card */
#thx{position:fixed;inset:0;z-index:99997;background:rgba(43,45,66,.45);display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;transition:opacity .3s ease}
#thx.in{opacity:1}
#thx .box{background:#fff;border-radius:28px;padding:26px 22px 22px;max-width:340px;width:100%;text-align:center;box-shadow:0 24px 60px -12px rgba(43,45,66,.45);transform:translateY(14px) scale(.97);transition:transform .35s cubic-bezier(.2,.8,.3,1)}
#thx.in .box{transform:none}
#thx img{width:100%;max-width:260px;height:auto;display:block;margin:0 auto 12px}
#thx h2{margin:0;font-family:var(--display);font-weight:600;font-size:1.1rem;line-height:1.3;color:var(--pink-deep);white-space:nowrap}
#thx h2 svg{vertical-align:-4px;margin:0 3px}
#thx p{margin:10px 0 18px;font-size:1.02rem;color:var(--muted);font-weight:600}
#thx button{font:inherit;font-weight:800;border:0;border-radius:999px;background:var(--pink-deep);color:#fff;padding:10px 30px;font-size:.95rem;cursor:pointer}
@media (prefers-reduced-motion:reduce){#thx,#thx .box{transition:none}}
/* loader + page fade */
#boot{position:fixed;inset:0;z-index:99999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden;transition:opacity .45s ease}
#boot.out{opacity:0;pointer-events:none}
#boot .track{position:relative;width:100%;height:120px}
#boot .ft{position:absolute;bottom:0;left:0;width:64px;will-change:transform;animation:bootwalk 3.2s linear infinite}
#boot .ft img{display:block;width:100%;height:auto;transform-origin:50% 90%;animation:boothop .5s ease-in-out infinite alternate}
#boot .ft.b{animation-delay:-.7s}
#boot .ft.b img{animation-delay:-.25s}
#boot p{margin:0;font-family:var(--display);font-weight:600;font-size:1.15rem;color:var(--pink-deep);text-align:center;padding:0 20px}
#boot p span{display:inline-block;animation:bootdot 1.2s ease-in-out infinite}
#boot p span:nth-child(2){animation-delay:.2s}#boot p span:nth-child(3){animation-delay:.4s}
@keyframes bootwalk{from{transform:translateX(-90px)}to{transform:translateX(100vw)}}
@keyframes boothop{from{transform:translateY(0) rotate(-7deg)}to{transform:translateY(-14px) rotate(7deg)}}
@keyframes bootdot{0%,100%{opacity:.25}50%{opacity:1}}
body{transition:opacity .22s ease}
body.leaving{opacity:0}
body.leaving,body.arrive{overflow-x:hidden}
body.leaving #root{transition:transform .23s ease}
body.leaving.gof #root{transform:translateX(-44px)}
body.leaving.gob #root{transform:translateX(44px)}
body.arrive.fr #root{animation:pginr .38s ease both}
body.arrive.fl #root{animation:pginl .38s ease both}
@keyframes pginr{from{opacity:0;transform:translateX(44px)}to{opacity:1;transform:none}}
@keyframes pginl{from{opacity:0;transform:translateX(-44px)}to{opacity:1;transform:none}}
body.arrive #root{animation:pgin .38s ease both}
@keyframes pgin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#boot,body{transition:none}#boot .ft,#boot .ft img,#boot p span{animation:none}#boot .ft{left:calc(50% - 32px)}body.arrive #root,body.arrive.fr #root,body.arrive.fl #root{animation:none}body.leaving #root{transition:none;transform:none}}
/* page tabs */
.pgt{display:flex;gap:6px}
.pgt a{flex:1;text-align:center;padding:7px 8px;border-radius:999px;font-weight:800;font-size:.84rem;text-decoration:none;border:2px solid var(--line);color:var(--muted);background:var(--surface);line-height:1.2;white-space:nowrap}
.pgt a small{font-weight:600;opacity:.85;font-size:.74rem}
.pgt a.on{background:var(--pink-deep);border-color:var(--pink-deep);color:#fff}
/* ess tabs */
.pgt{align-items:stretch}
.pgt a{display:flex;flex-direction:column;align-items:center;justify-content:center;white-space:normal;padding:6px 5px;font-size:.8rem}
.pgt a small{display:block;font-size:.7rem}
.pgt a.ess{flex:1.35}
.seg.cats button{padding:7px 11px;font-size:.84rem}
/* sect title */
.sect{text-align:center;margin:26px 12px 4px}
.sect h2{font-family:var(--display);font-weight:700;font-size:1.9rem;line-height:1.15;margin:0;background:linear-gradient(90deg,#fb8cb1,#30aafe);-webkit-background-clip:text;background-clip:text;color:transparent;text-wrap:balance}
.sect p{margin:4px 0 0;color:var(--muted);font-weight:600}
.seg button[aria-pressed="true"][data-cat="all"]{background:var(--fg);color:#fff}
.seg button[aria-pressed="true"][data-cat="wear"]{background:var(--pink);color:#fff}
.seg button[aria-pressed="true"][data-cat="care"]{background:var(--blue);color:#fff}
#pg.own{display:block;padding:10px 14px;font-size:.85rem;font-weight:600;color:var(--blue-deep);text-align:center;background:var(--blue-soft)}
@media(prefers-reduced-motion:reduce){#evt .d{animation:none}}
.sizes{color:var(--muted);font-size:.85rem}
.empty{border:2px dashed var(--line);border-radius:20px;padding:36px 20px;text-align:center;color:var(--muted);background:var(--surface)}
.empty b{display:block;color:var(--fg);font-family:var(--display);font-size:1.3rem;margin-bottom:4px}

/* photo request */
.request{margin-top:40px;border-radius:28px;background:var(--blue-soft);display:grid;grid-template-columns:130px minmax(0,1fr);gap:20px;align-items:center;padding:24px}
.rq-m{width:130px;max-width:100%;display:block}
.request h2{font-family:var(--display);font-weight:700;font-size:1.7rem;margin:0 0 6px;color:var(--blue-deep);text-wrap:balance}
.request p{margin:0 0 12px;max-width:52ch}
.rq-steps{margin:0 0 16px;padding-left:20px;display:grid;gap:4px;font-weight:700}

/* contact */
.contact{margin-block:44px 24px;border-radius:28px;background:var(--surface);border:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:24px;padding:22px;align-items:center}
.contact .poster{width:100%;border-radius:18px;display:block}

.clist{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.clist li{display:grid;grid-template-columns:42px 1fr;gap:12px;align-items:center;min-width:0}
.ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--pink-soft);color:var(--pink-deep)}
.ic.b{background:var(--blue-soft);color:var(--blue-deep)}
.ic svg{width:20px;height:20px}
.clist small{display:block;font-size:.74rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--blue)}
.clist b{font-weight:700;user-select:all;overflow-wrap:anywhere}
.parents{display:flex;gap:6px;justify-content:flex-end;margin-top:6px}
.parents img{height:130px;width:auto}
.foot{padding-block:18px 40px;color:var(--muted);font-size:.85rem;text-align:center}

/* manage */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;margin-block:18px;display:grid;gap:14px}
.panel h2{font-family:var(--display);font-size:1.35rem;margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{display:grid;gap:4px;font-size:.8rem;color:var(--muted);font-weight:700;min-width:0}
input[type=text],input[type=number],input[type=tel],select{font:inherit;font-size:.93rem;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;min-width:0}
.edit{display:grid;gap:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.meter{font-size:.84rem;color:var(--muted);font-variant-numeric:tabular-nums}
.filepick{font:inherit;font-size:.9rem;color:var(--fg);background:var(--pink-soft);border:2px dashed var(--pink);border-radius:14px;padding:12px;width:100%;min-width:0}
.hidden-file{position:absolute;width:1px;height:1px;opacity:0}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--bg);border-radius:14px;padding:12px;display:grid;gap:2px;min-width:0}
.stat span{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800}
.stat b{font-family:var(--display);font-size:1.25rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;color:var(--blue-deep)}
.stat small{color:var(--muted);font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto;max-height:340px;overflow-y:auto;border-top:1px solid var(--line)}

table.sales td{padding:8px 6px;border-top:1px solid var(--line)}
.r{text-align:right}.nw{white-space:nowrap}
.linkbtn{font:inherit;font-size:.82rem;font-weight:700;background:none;border:0;color:var(--danger);cursor:pointer;padding:2px 4px}
.savebar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;z-index:6;box-shadow:0 -6px 20px -12px rgba(43,45,66,.3)}

      im.onload = function(){
        var max = 900, s = Math.min(1, max/Math.max(im.naturalWidth, im.naturalHeight));
        var c = document.createElement('canvas'); c.width = Math.round(im.naturalWidth*s); c.height = Math.round(im.naturalHeight*s);
        var cx = c.getContext('2d'); cx.fillStyle='#fff'; cx.fillRect(0,0,c.width,c.height); cx.drawImage(im,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg', 0.72));

      im.onerror = function(){ rej(new Error('bad image')); };

          x.fillStyle='#222'; x.font='600 '+Math.round(60*S)+'px '+F;

          y+=Math.round(30*S);

          y+=Math.round(75*S);
          x.font='800 '+Math.round(62*S)+'px '+F; x.fillText(total,W/2,y);

          x.fillStyle='#333'; x.font='600 '+Math.round(46*S)+'px '+F; x.fillText(deliv,W/2,y);
          y+=Math.round(115*S);
          x.fillStyle='#e8548a'; x.font='800 '+Math.round(56*S)+'px '+F; x.fillText('♥ Thank You ♥',W/2,y);
          cv.toBlob(function(b){ if(!b){ rej(new Error('blob')); return; } res(new File([b],'order-total.jpg',{type:'image/jpeg'})); },'image/jpeg',0.92);
        }catch(err){ rej(err); }
      });
    }
    document.addEventListener('click',function(e){
      var a=e.target.closest && e.target.closest('a.wa[href*="wa.me"]');
      if(!a || busy || ui.canEdit || ui.manage || a.getAttribute('data-nopic')) return;
      var href=a.getAttribute('href')||'', m=/[?&]text=([^&]*)/.exec(href); if(!m) return;
      var text; try{ text=decodeURIComponent(m[1]); }catch(x){ return; }
      var codes=[], re=/(?:^|\n)(CB\d+) \u00B7 /g, mm;
      while((mm=re.exec(text))){ if(codes.indexOf(mm[1])<0) codes.push(mm[1]); }
      if(!codes.length || codes.length>30 || !canShareFiles()) return;
      e.preventDefault(); busy=true;
      var fall=function(){ busy=false; var go=function(){ var w=null; try{ w=window.open(href,'_blank'); }catch(x){} if(!w) location.href=href; }; try{ if(navigator.share){ navigator.share({text:text}).catch(function(er){ if(!(er&&er.name==='AbortError')) go(); }); return; } }catch(x){} go(); };
      Promise.all(codes.map(labeled)).then(function(files){
        var msg=text.replace(/\n?[ \t]*📷 https?:\/\/\S+/g,'');
        return Promise.all([summaryFile(msg,1080)]).then(function(r){ files.push(r[0]); return files; });
      }).then(function(files){
        var ok=false; try{ ok=navigator.canShare({files:files}); }catch(x){}
        if(!ok){ fall(); return; }
        navigator.share({files:files}).then(function(){ busy=false; }).catch(function(err){
          if(err && err.name==='AbortError'){ busy=false; return; }
          fall();
        });
      }).catch(fall);
    },true);
  })();

  /* ---- loading screen (walking feet) + smooth Singles/Sets switch ---- */
  var fromTab=false;
  var navDir='f';
  try{ fromTab = sessionStorage.getItem('cbo-nav')==='1'; sessionStorage.removeItem('cbo-nav'); navDir=sessionStorage.getItem('cbo-dir')||'f'; sessionStorage.removeItem('cbo-dir'); }catch(e){}
  var bootEl=null, bootT0=Date.now(), skipBoot=fromTab;

  if(!skipBoot){

    bootEl.innerHTML='<div class="track"><div class="ft"><img src="'+B.pink+'" alt=""></div><div class="ft b"><img src="'+B.blue+'" alt=""></div></div><p>Getting the cutest clothes ready<span>.</span><span>.</span><span>.</span></p>';
    document.body.appendChild(bootEl);
  } else if(fromTab){ document.body.classList.add('arrive', navDir==='f'?'fr':'fl'); }
  function hideBoot(){

  document.addEventListener('click',function(e){

    document.body.classList.add('leaving', fwd?'gof':'gob');
    setTimeout(function(){ location.href=href; },230);

  ui.dirty = false; // migration is saved with the owner's next save

  if (window.claude && window.claude.use){
    window.claude.use('user').then(function(u){
      if (u && u.canEdit && u.canEdit()){
        ui.canEdit = true;
        try { if (sessionStorage.getItem('cbo-manage')==='1') ui.manage = true; } catch(x){}
        render(); startSales();

})();

/* share mode */
(function(){
  var on=false;
  try{ if(/[?&]share(=|&|$)/.test(location.search)) sessionStorage.setItem('cbo-share','1'); on=sessionStorage.getItem('cbo-share')==='1'; }catch(e){ on=/[?&]share(=|&|$)/.test(location.search); }
  if(!on) return;
  var root=document.getElementById('root'); if(!root) return;
  var cat; try{ cat=JSON.parse(document.getElementById('catalog').textContent); }catch(e){ return; }
  var items={}; (cat.items||[]).forEach(function(it){ if(it.code) items[it.code]=it; });
  var PHOTO='https://luminous-moxie-eed1fb.netlify.app/photos/', MAX=30, sel=(function(){ try{ var a=JSON.parse(sessionStorage.getItem('cbo-sel')||'[]'); return Array.isArray(a)?a.filter(function(x){ return typeof x==='string'; }).slice(0,30):[]; }catch(e){ return []; } })(), toastEl=null, toastT=0;
  document.body.classList.add('sharemode');
  var ban=document.createElement('div'); ban.className='sm-banner';
  ban.innerHTML='<span>📤 Share mode<small>tap the circles, then Send. Your picks follow you between pages</small></span><button type="button" class="sm-exit">Exit</button>';
  document.body.insertBefore(ban,document.body.firstChild);
  var bar=document.createElement('div'); bar.className='sm-bar'; bar.hidden=true;
  bar.innerHTML='<button type="button" class="sm-send"><b></b><span>to WhatsApp</span></button><button type="button" class="sm-clear">Clear</button>';
  document.body.appendChild(bar);
  function toast(m){ if(toastEl) toastEl.remove(); toastEl=document.createElement('div'); toastEl.className='sm-toast'; toastEl.textContent=m; document.body.appendChild(toastEl); clearTimeout(toastT); toastT=setTimeout(function(){ if(toastEl){ toastEl.remove(); toastEl=null; } },3200); }
  function codeOf(c){ var h=c.querySelector('[data-fav]'); return h?h.getAttribute('data-fav'):''; }
  function paint(){
    try{ sessionStorage.setItem('cbo-sel',JSON.stringify(sel)); }catch(e){}
    var cards=root.querySelectorAll('.card');
    for(var i=0;i<cards.length;i++){
      var c=cards[i], code=c.getAttribute('data-smcode'); if(!code) continue;
      var t=c.querySelector('.sm-tick'), is=sel.indexOf(code)>=0;
      c.classList.toggle('sm-on',is); if(t){ t.classList.toggle('on',is); t.textContent=is?'✓':''; t.setAttribute('aria-pressed',is); }
    }
    bar.hidden=!sel.length; document.body.classList.toggle('sm-has',sel.length>0);
    bar.querySelector('b').textContent='Send '+sel.length+' picture'+(sel.length===1?'':'s');
  }
  function decorate(){
    var cards=root.querySelectorAll('.card');
    for(var i=0;i<cards.length;i++){
      var c=cards[i], ph=c.querySelector('.ph'); if(!ph) continue;
      var code=codeOf(c); if(!code||!items[code]) continue;
      if(c.getAttribute('data-smcode')===code && ph.querySelector('.sm-tick')) continue;
      c.setAttribute('data-smcode',code);
      var t=document.createElement('button'); t.type='button'; t.className='sm-tick'; t.setAttribute('aria-label','Pick this picture');
      var s=document.createElement('button'); s.type='button'; s.className='sm-one'; s.textContent='Send this';
      ph.appendChild(t); ph.appendChild(s);
    }
    paint();
  }
  function toFile(it){
    var m=/^data:([^;]+);base64,(.*)$/.exec(it.img||''); if(!m) return null;
    var bin=atob(m[2]), n=bin.length, u=new Uint8Array(n); for(var i=0;i<n;i++) u[i]=bin.charCodeAt(i);
    return new File([u],it.code+'.jpg',{type:m[1]});
  }
  var lastErr='';
  function stashOne(c){ try{ if(items[c]&&items[c].img) sessionStorage.setItem('cbo-img-'+c,items[c].img); }catch(e){} }
  function unstashOne(c){ try{ sessionStorage.removeItem('cbo-img-'+c); }catch(e){} }
  function unstashAll(){ try{ for(var i=sessionStorage.length-1;i>=0;i--){ var k=sessionStorage.key(i); if(k&&k.indexOf('cbo-img-')===0) sessionStorage.removeItem(k); } }catch(e){} }
  function srcFor(it){
    if(it.img) return Promise.resolve(it.img);
    try{ var st=sessionStorage.getItem('cbo-img-'+it.code); if(st) return Promise.resolve(st); }catch(e){}
    return fetch(PHOTO+it.code+'.jpg?cors=1',{mode:'cors',cache:'reload'}).then(function(r){ if(!r.ok) throw new Error('error '+r.status); return r.blob(); }).then(function(b){ return URL.createObjectURL(b); });
  }
  function toLabeled(it){
    return new Promise(function(res,rej){
      var im=new Image();
      im.onload=function(){
        try{
          var w=im.naturalWidth, h=im.naturalHeight, bar=Math.round(w*0.13);
          var c=document.createElement('canvas'); c.width=w; c.height=h+bar;
          var x=c.getContext('2d'); x.fillStyle='#ffffff'; x.fillRect(0,0,w,h+bar); x.drawImage(im,0,0,w,h);
          x.fillStyle='#e0457b'; x.textAlign='center'; x.textBaseline='middle';
          x.font='800 '+Math.round(bar*0.62)+'px Nunito, Arial, sans-serif';
          x.fillText(String(it.code||''), w/2, h+bar/2+1);
          c.toBlob(function(b){ if(!b){ rej(new Error('blob')); return; } res(new File([b],it.code+'.jpg',{type:'image/jpeg'})); },'image/jpeg',0.92);
        }catch(e){ rej(e); }
      };
      im.onerror=function(){ rej(new Error('img')); };
      srcFor(it).then(function(u){ im.src=u; },rej);
    });
  }
  function line(it){ return it.code; }
  function caption(list){ return list.map(line).join('\n'); }
  function linkFallback(list){
    var t=caption(list)+'\n\n'+list.map(function(it){ return '📷 '+PHOTO+it.code+'.jpg'; }).join('\n');
    var u='https://wa.me/?text='+encodeURIComponent(t);
    toast('Some pictures couldn’t be loaded'+(lastErr?' ('+lastErr+')':'')+', so I’m sending photo links instead.');
    var go=function(){ var w=null; try{ w=window.open(u,'_blank'); }catch(e){} if(!w) location.href=u; };
    if(navigator.share){ navigator.share({text:t}).catch(function(e){ if(e&&e.name==='AbortError') return; go(); }); return; }
    go();
  }
  function shareCodes(codes,clearAfter){
    var list=codes.map(function(c){ return items[c]||{code:c}; }); if(!list.length) return;
    Promise.all(list.map(function(it){ return toLabeled(it).catch(function(e){ lastErr=(e&&e.message)||'error'; return toFile(it); }); })).then(function(files){
      files=files.filter(Boolean);
      var ok=false; try{ ok=files.length===list.length && navigator.share && navigator.canShare && navigator.canShare({files:files}); }catch(e){}
      if(!ok){ linkFallback(list); return; }
      navigator.share({files:files}).then(function(){ if(clearAfter){ sel.length=0; unstashAll(); paint(); } }).catch(function(e){ if(e&&e.name==='AbortError') return; linkFallback(list); });
    });
  }
  document.addEventListener('click',function(e){
    var el=e.target.closest&&e.target.closest('.sm-tick,.sm-one,.sm-send,.sm-clear,.sm-exit'); if(!el) return;
    e.preventDefault(); e.stopPropagation();
    if(el.classList.contains('sm-exit')){ try{ sessionStorage.removeItem('cbo-share'); sessionStorage.removeItem('cbo-sel'); }catch(x){} unstashAll(); location.href=location.pathname; return; }
    if(el.classList.contains('sm-clear')){ sel.length=0; unstashAll(); paint(); return; }
    if(el.classList.contains('sm-send')){ shareCodes(sel.slice(),true); return; }
    var card=el.closest('.card'), code=card&&card.getAttribute('data-smcode'); if(!code) return;
    if(el.classList.contains('sm-one')){ shareCodes([code],false); return; }
    var i=sel.indexOf(code);
    if(i>=0){ sel.splice(i,1); unstashOne(code); } else { if(sel.length>=MAX){ toast('You can pick up to '+MAX+' at a time.'); return; } sel.push(code); stashOne(code); }
    paint();
  },true);
  var mo=new MutationObserver(function(){ mo.disconnect(); decorate(); mo.observe(root,{childList:true,subtree:true}); });
  decorate(); mo.observe(root,{childList:true,subtree:true});
})();
</script>
