/* Layout: logo bar, pastel hero flanked by the two foot mascots, sticky filter strip (boys/girls, age, in stock), New Arrivals grid then All Clothes grid, contact block with poster and parent mascots. Single light look, matching the brand's printed materials. */
:root{

  --bg:#fffafc; --surface:#ffffff; --fg:#2b2d42; --muted:#6e7089; --line:#f1dfe8;

  --body:"Nunito",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:1140px;margin:0 auto;padding-inline:16px;padding-block:0}

.btn{font:inherit;font-weight:700;font-size:.92rem;border-radius:999px;padding:10px 18px;border:2px solid var(--fg);background:var(--surface);color:var(--fg);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pink{background:var(--pink-deep);border-color:var(--pink-deep);color:#fff}
.btn.blue{background:var(--blue-deep);border-color:var(--blue-deep);color:#fff}
.btn.wa{background:#6FC79A;border-color:#6FC79A;color:#fff}
.btn.ghost{border-color:var(--line)}
.btn.danger{border-color:var(--danger);color:var(--danger);background:var(--surface)}
.btn.sm{font-size:.82rem;padding:6px 12px}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,.seg button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px}
.bar img{height:58px;width:auto;display:block}

/* hero */

  border:1px solid var(--line);display:grid;grid-template-columns:150px 1fr 150px;align-items:end;gap:12px;padding:28px 20px 0}

html[lang=ar]{--display:'Cairo','Tajawal',system-ui,'Segoe UI',Tahoma,sans-serif}
html[lang=ar] body,html[lang=ar] button,html[lang=ar] input{font-family:'Cairo','Tajawal',system-ui,'Segoe UI',Tahoma,sans-serif}
html[lang=ar] .hero h1{line-height:1.25}
html[lang=fr] .pill,html[lang=ar] .pill{white-space:nowrap}
/* softer rounded photos + tags that no longer overlap */
.card .ph{border-radius:34px}
.card .ph img{border-radius:34px}
.card .ph .pill{top:16px;left:16px;font-size:.6rem;letter-spacing:.02em;padding:3px 8px}
.card .ph .newtag{top:15px;right:16px;font-size:.68rem;padding:2px 9px}
.card .ph .pill:has(~ .newtag){top:46px;left:auto;right:16px}
/* brand name heading */
.hero h1 .b,.hero h1 .p{background:linear-gradient(90deg,#fb8cb1 0%,#f27aa8 30%,#6fb9ff 70%,#30aafe 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
/* wavy dividers */
.wv{margin:6px -2px 10px;line-height:0;pointer-events:none}
.wv svg{width:100%;height:50px;display:block}
/* thank-you card */
#thx{position:fixed;inset:0;z-index:99997;background:rgba(43,45,66,.45);display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;transition:opacity .3s ease}
#thx.in{opacity:1}
#thx .box{background:#fff;border-radius:28px;padding:26px 22px 22px;max-width:340px;width:100%;text-align:center;box-shadow:0 24px 60px -12px rgba(43,45,66,.45);transform:translateY(14px) scale(.97);transition:transform .35s cubic-bezier(.2,.8,.3,1)}
#thx.in .box{transform:none}
#thx img{width:100%;max-width:260px;height:auto;display:block;margin:0 auto 12px}
#thx h2{margin:0;font-family:var(--display);font-weight:600;font-size:1.1rem;line-height:1.3;color:var(--pink-deep);white-space:nowrap}
#thx h2 svg{vertical-align:-4px;margin:0 3px}
#thx p{margin:10px 0 18px;font-size:1.02rem;color:var(--muted);font-weight:600}
#thx button{font:inherit;font-weight:800;border:0;border-radius:999px;background:var(--pink-deep);color:#fff;padding:10px 30px;font-size:.95rem;cursor:pointer}
@media (prefers-reduced-motion:reduce){#thx,#thx .box{transition:none}}
/* loader + page fade */
#boot{position:fixed;inset:0;z-index:99999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden;transition:opacity .45s ease}
#boot.out{opacity:0;pointer-events:none}
#boot .track{position:relative;width:100%;height:120px}
#boot .ft{position:absolute;bottom:0;left:0;width:64px;will-change:transform;animation:bootwalk 3.2s linear infinite}
#boot .ft img{display:block;width:100%;height:auto;transform-origin:50% 90%;animation:boothop .5s ease-in-out infinite alternate}
#boot .ft.b{animation-delay:-.7s}
#boot .ft.b img{animation-delay:-.25s}
#boot p{margin:0;font-family:var(--display);font-weight:600;font-size:1.15rem;color:var(--pink-deep);text-align:center;padding:0 20px}
#boot p span{display:inline-block;animation:bootdot 1.2s ease-in-out infinite}
#boot p span:nth-child(2){animation-delay:.2s}#boot p span:nth-child(3){animation-delay:.4s}
@keyframes bootwalk{from{transform:translateX(-90px)}to{transform:translateX(100vw)}}
@keyframes boothop{from{transform:translateY(0) rotate(-7deg)}to{transform:translateY(-14px) rotate(7deg)}}
@keyframes bootdot{0%,100%{opacity:.25}50%{opacity:1}}
body{transition:opacity .22s ease}
body.leaving{opacity:0}
body.leaving,body.arrive{overflow-x:hidden}
body.leaving #root{transition:transform .23s ease}
body.leaving.gof #root{transform:translateX(-44px)}
body.leaving.gob #root{transform:translateX(44px)}
body.arrive.fr #root{animation:pginr .38s ease both}
body.arrive.fl #root{animation:pginl .38s ease both}
@keyframes pginr{from{opacity:0;transform:translateX(44px)}to{opacity:1;transform:none}}
@keyframes pginl{from{opacity:0;transform:translateX(-44px)}to{opacity:1;transform:none}}
body.arrive #root{animation:pgin .38s ease both}
@keyframes pgin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#boot,body{transition:none}#boot .ft,#boot .ft img,#boot p span{animation:none}#boot .ft{left:calc(50% - 32px)}body.arrive #root,body.arrive.fr #root,body.arrive.fl #root{animation:none}body.leaving #root{transition:none;transform:none}}
/* page tabs */
.pgt{display:flex;gap:6px}
.pgt a{flex:1;text-align:center;padding:7px 8px;border-radius:999px;font-weight:800;font-size:.84rem;text-decoration:none;border:2px solid var(--line);color:var(--muted);background:var(--surface);line-height:1.2;white-space:nowrap}
.pgt a small{font-weight:600;opacity:.85;font-size:.74rem}
.pgt a.on{background:var(--pink-deep);border-color:var(--pink-deep);color:#fff}
/* ess tabs */
.pgt{align-items:stretch}
.pgt a{display:flex;flex-direction:column;align-items:center;justify-content:center;white-space:normal;padding:6px 5px;font-size:.8rem}
.pgt a small{display:block;font-size:.7rem}
.pgt a.ess{flex:1.35}
.seg.cats button{padding:7px 11px;font-size:.84rem}
/* sect title */
.sect{text-align:center;margin:26px 12px 4px}
.sect h2{font-family:var(--display);font-weight:700;font-size:1.9rem;line-height:1.15;margin:0;background:linear-gradient(90deg,#fb8cb1,#30aafe);-webkit-background-clip:text;background-clip:text;color:transparent;text-wrap:balance}
.sect p{margin:4px 0 0;color:var(--muted);font-weight:600}
.seg button[aria-pressed="true"][data-cat="all"]{background:var(--fg);color:#fff}
.seg button[aria-pressed="true"][data-cat="wear"]{background:var(--pink);color:#fff}
.seg button[aria-pressed="true"][data-cat="care"]{background:var(--blue);color:#fff}
#pg.own{display:block;padding:10px 14px;font-size:.85rem;font-weight:600;color:var(--blue-deep);text-align:center;background:var(--blue-soft)}
@media(prefers-reduced-motion:reduce){#evt .d{animation:none}}
.sizes{color:var(--muted);font-size:.85rem}
.empty{border:2px dashed var(--line);border-radius:20px;padding:36px 20px;text-align:center;color:var(--muted);background:var(--surface)}
.empty b{display:block;color:var(--fg);font-family:var(--display);font-size:1.3rem;margin-bottom:4px}

/* photo request */
.request{margin-top:40px;border-radius:28px;background:var(--blue-soft);display:grid;grid-template-columns:130px minmax(0,1fr);gap:20px;align-items:center;padding:24px}
.rq-m{width:130px;max-width:100%;display:block}
.request h2{font-family:var(--display);font-weight:700;font-size:1.7rem;margin:0 0 6px;color:var(--blue-deep);text-wrap:balance}
.request p{margin:0 0 12px;max-width:52ch}
.rq-steps{margin:0 0 16px;padding-left:20px;display:grid;gap:4px;font-weight:700}
@media (max-width:520px){.request{grid-template-columns:1fr;padding:20px}.rq-m{width:96px}}

/* contact */
.contact{margin-block:44px 24px;border-radius:28px;background:var(--surface);border:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:24px;padding:22px;align-items:center}
.contact .poster{width:100%;border-radius:18px;display:block}
.contact h2{font-family:var(--display);font-size:1.8rem;margin:0 0 14px}
.clist{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.clist li{display:grid;grid-template-columns:42px 1fr;gap:12px;align-items:center;min-width:0}
.ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--pink-soft);color:var(--pink-deep)}
.ic.b{background:var(--blue-soft);color:var(--blue-deep)}
.ic svg{width:20px;height:20px}
.clist small{display:block;font-size:.74rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--blue)}
.clist b{font-weight:700;user-select:all;overflow-wrap:anywhere}
.parents{display:flex;gap:6px;justify-content:flex-end;margin-top:6px}
.parents img{height:130px;width:auto}
.foot{padding-block:18px 40px;color:var(--muted);font-size:.85rem;text-align:center}

/* manage */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;margin-block:18px;display:grid;gap:14px}
.panel h2{font-family:var(--display);font-size:1.35rem;margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{display:grid;gap:4px;font-size:.8rem;color:var(--muted);font-weight:700;min-width:0}
input[type=text],input[type=number],input[type=tel],select{font:inherit;font-size:.93rem;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;min-width:0}
.edit{display:grid;gap:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.agepick{display:flex;flex-wrap:wrap;gap:5px}
.agepick .chip{font-size:.75rem;padding:3px 9px}
.stock{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.stock input{text-align:center;font-variant-numeric:tabular-nums}
.note{font-size:.8rem;color:var(--muted)}
.meter{font-size:.84rem;color:var(--muted);font-variant-numeric:tabular-nums}
.filepick{font:inherit;font-size:.9rem;color:var(--fg);background:var(--pink-soft);border:2px dashed var(--pink);border-radius:14px;padding:12px;width:100%;min-width:0}
.hidden-file{position:absolute;width:1px;height:1px;opacity:0}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--bg);border-radius:14px;padding:12px;display:grid;gap:2px;min-width:0}
.stat span{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800}
.stat b{font-family:var(--display);font-size:1.25rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;color:var(--blue-deep)}
.stat small{color:var(--muted);font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto;max-height:340px;overflow-y:auto;border-top:1px solid var(--line)}
table.sales{width:100%;border-collapse:collapse;font-size:.9rem;font-variant-numeric:tabular-nums}
table.sales th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px 6px;position:sticky;top:0;background:var(--surface)}
table.sales td{padding:8px 6px;border-top:1px solid var(--line)}
.r{text-align:right}.nw{white-space:nowrap}
.linkbtn{font:inherit;font-size:.82rem;font-weight:700;background:none;border:0;color:var(--danger);cursor:pointer;padding:2px 4px}
.savebar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;z-index:6;box-shadow:0 -6px 20px -12px rgba(43,45,66,.3)}
.savebar .msg{font-size:.9rem;font-weight:700}
.spacer{height:90px}

@media (max-width:760px){
  .hero{grid-template-columns:1fr 1fr;padding:22px 14px 0}
  .hero .copy{grid-column:1/-1;grid-row:1;padding-bottom:6px}
  .hero .mascot{width:110px;justify-self:center}
  .contact{grid-template-columns:1fr}
  .parents{justify-content:center}
}
@media (max-width:520px){
  .bar img{height:46px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .meta{flex-direction:column;gap:0}
  .two{grid-template-columns:1fr}
  .instock{margin-left:0}
  .stat b{font-size:1rem}.stat{padding:10px}
}
@media (prefers-reduced-motion:no-preference){.hero .mascot{animation:bob 4s ease-in-out infinite}.hero .mascot.r{animation-delay:-2s}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* share mode */
.sharemode .a2hs,.sharemode .favbar,.sharemode .musicbtn{display:none!important}
.sm-banner{position:sticky;top:0;z-index:70;background:linear-gradient(90deg,#fb8cb1,#30aafe);color:#fff;font-family:var(--display,inherit);font-weight:800;font-size:.95rem;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sm-banner small{font-weight:600;opacity:.95;font-size:.78rem;margin-left:4px}
.sm-exit{border:0;border-radius:999px;background:rgba(255,255,255,.28);color:#fff;font-weight:800;padding:6px 14px;font-size:.85rem;cursor:pointer}
.sm-tick{position:absolute;left:8px;top:8px;z-index:6;width:34px;height:34px;border-radius:50%;background:#fff;border:2.5px solid #30aafe;box-shadow:0 2px 8px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;font-size:19px;line-height:1;color:#fff;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.sm-tick.on{background:#30aafe}
.card.sm-on{outline:3px solid #30aafe;outline-offset:-3px;border-radius:18px}
.sm-one{position:absolute;right:8px;bottom:8px;z-index:6;background:#25d366;color:#fff;border:0;border-radius:999px;padding:7px 12px;font-weight:800;font-size:.74rem;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer}
.sm-bar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:80;display:flex;gap:8px;align-items:stretch}
.sm-bar[hidden]{display:none}
.sm-send{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:#25d366;color:#fff;border:0;border-radius:18px;padding:12px 16px;font-family:var(--display,inherit);font-weight:800;font-size:1rem;box-shadow:0 6px 20px rgba(0,0,0,.3);cursor:pointer;text-align:left}
.sm-send span{font-weight:600;font-size:.78rem;opacity:.95}
.sm-clear{border:0;border-radius:18px;background:#fff;color:#444;font-weight:800;padding:0 16px;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer}
.sm-toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:90;background:#333;color:#fff;border-radius:14px;padding:10px 16px;font-size:.85rem;max-width:86vw;text-align:center}
.sharemode.sm-has{padding-bottom:96px}
</style>

  (function(){
    var lb=null, list=[], idx=0, pushed=false, sx=0, sy=0, onKey=null;
    function collect(){
      list=[].slice.call(root.querySelectorAll('article.card')).map(function(c){
        var im=c.querySelector('.ph img'); if(!im) return null;
        var q=function(sel){var e=c.querySelector(sel);return e?e.textContent.trim():'';};
        var pill=c.querySelector('.pill');
        var tags=[].slice.call(c.querySelectorAll('.tags > *')).map(function(t){return t.textContent.trim();}).filter(Boolean).join(' · ');
        var wa=c.querySelector('a.btn.wa');

      }).filter(Boolean);
    }
    function show(){
      if(!lb) return; var it=list[idx]; if(!it) return;
      lb.querySelector('.lb-img').src=it.src;

      [idx+1,idx-1].forEach(function(j){var n=list[(j+list.length)%list.length]; if(n){var p=new Image(); p.src=n.src;}});
    }
    function go(d){ if(!list.length) return; idx=(idx+d+list.length)%list.length; show(); }

      if(!lb) return;

      });
      lb.addEventListener('touchstart',function(e){ var t=e.touches[0]; sx=t.clientX; sy=t.clientY; },{passive:true});
      lb.addEventListener('touchend',function(e){

    }
    window.addEventListener('popstate',function(){ if(lb){ pushed=false; close(true); } });
    root.addEventListener('click',function(e){

  function toJpeg(file){
    return new Promise(function(res, rej){
      var fr = new FileReader();
      fr.onerror = function(){ rej(new Error('read failed')); };
      fr.onload = function(){
      var im = new Image();
      im.onload = function(){
        var max = 900, s = Math.min(1, max/Math.max(im.naturalWidth, im.naturalHeight));
        var c = document.createElement('canvas'); c.width = Math.round(im.naturalWidth*s); c.height = Math.round(im.naturalHeight*s);
        var cx = c.getContext('2d'); cx.fillStyle='#fff'; cx.fillRect(0,0,c.width,c.height); cx.drawImage(im,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg', 0.72));
      };
      im.onerror = function(){ rej(new Error('bad image')); };
      im.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }

  function addFiles(files){
    ui.note = 'Adding ' + files.length + ' photo' + (files.length>1?'s':'') + '…'; render();

      return p.then(function(){ return toJpeg(f).then(function(img){
        var name = f.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').trim();
        if (/^[0-9a-f ]{20,}$/i.test(name) || /^(img|image|photo|whatsapp image)\b/i.test(name)) name = '';
        work.items.unshift({id: Date.now().toString(36)+Math.random().toString(36).slice(2,6), name: name, price:'', sizes:'', gender:'unisex', cat: isEss?'wear':undefined, ages:[], holds:[], qty:1, available:true, addedAt: Date.now(), code: nextCode(), img: img});
      }, function(){ skipped++; }); });
    }, Promise.resolve()).then(function(){
      changed();
      if (JSON.stringify(work).length > LIMIT) ui.note = 'Too many photos to fit. Delete some before saving.';
      else if (skipped) ui.note = skipped + ' file(s) could not be read as images.';
      render();
    });
  }

  function save(note){
    if (JSON.stringify(work).length > LIMIT){ ui.note = 'Too many photos to fit. Delete some, then save.'; render(); return; }
    work.items.forEach(function(it){ var before = (it.holds||[]); it.holds = activeHolds(it); before.forEach(function(h){ if (it.holds.indexOf(h)<0) dropHoldDoc(h.id); }); });
    ui.saving = true; ui.note = note || 'Saving…'; render();
    window.claude.use('artifact').then(function(art){
      if (!art) throw {code:'not_granted'};
      return art.publish(buildDoc(work));
    }).then(function(){ ui.saving=false; ui.dirty=false; ui.note='Saved. Customers see the new version.'; render(); })
    .catch(function(err){
      ui.saving = false;
      var c = err && err.code;
      if (c==='conflict') ui.note = 'Someone else saved first. The page is reloading with their version.';
      else if (c==='not_writer'||c==='not_granted'||c==='not_declared'||c==='consent_required'){ ui.note='This view is read-only, so changes cannot be saved.'; ui.canEdit=false; ui.manage=false; ui.dirty=false; }
      else if (c==='too_large') ui.note = 'The shop is too large to save. Delete a few photos and try again.';
      else if (c==='rate_limited') ui.note = 'Saving too often. Wait a minute, then save again.';
      else ui.note = 'Could not save right now. Try again in a moment.';
      render();
    });
  }

  try{ if(/[?&]share(=|&|$)/.test(location.search)||sessionStorage.getItem('cbo-share')==='1') return; }catch(e){}
  var st=document.createElement('style');
  st.textContent='#cbo-top-btn{position:fixed;right:14px;bottom:86px;z-index:9990;width:52px;height:52px;border-radius:50%;border:0;padding:0;background:linear-gradient(135deg,#ec5b92,#3b9cf5);color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.28);font-family:Nunito,Arial,sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transform:translateY(12px) scale(.9);pointer-events:none;transition:opacity .25s,transform .25s;-webkit-tap-highlight-color:transparent}#cbo-top-btn.on{opacity:1;transform:none;pointer-events:auto}#cbo-top-btn span{font-size:20px;line-height:1}#cbo-top-btn small{font:800 9px Nunito,Arial,sans-serif;margin-top:-1px}';
  document.head.appendChild(st);
  var b=document.createElement('button'); b.id='cbo-top-btn'; b.type='button'; b.setAttribute('aria-label','Back to top');
  b.innerHTML='<span>\u2191</span><small>TOP</small>';
  b.addEventListener('click',function(){ try{ window.scrollTo({top:0,behavior:'smooth'}); }catch(e){ window.scrollTo(0,0); } });
  document.body.appendChild(b);
  var tick=false;
  function upd(){ tick=false; var y=window.pageYOffset||document.documentElement.scrollTop||0; b.classList.toggle('on', y>900); }
  window.addEventListener('scroll',function(){ if(!tick){ tick=true; requestAnimationFrame(upd); } },{passive:true});
  upd();
})();
</script>
<script id="cbo-mascot">
(function(){
  if(document.getElementById('cbo-mh'))return;
  try{ if(/[?&]share(=|&|$)/.test(location.search)||sessionStorage.getItem('cbo-share')==='1')return; }catch(e){}
  var B={},C={};
  try{ B=JSON.parse(document.getElementById('brand').textContent)||{}; }catch(e){}
  try{ C=JSON.parse(document.getElementById('catalog').textContent)||{}; }catch(e){}
  if(!B.pink||!B.blue)return;
  var d=String((C.shop&&C.shop.whatsapp)||'0556967767').replace(/\D/g,''); if(d.length===10&&d.charAt(0)==='0')d='233'+d.slice(1);
  var wa='https://wa.me/'+d+'?text='+encodeURIComponent("Hello Cee's Babies Outlet 💗 I need help choosing something.");
  var st=document.createElement('style'); st.id='cbo-mascot-css';
  st.textContent=
  '@media (prefers-reduced-motion:no-preference){'+
  '.hero .mascot{animation:cbomb 5s ease-in-out infinite;transform-origin:50% 100%;cursor:pointer;-webkit-tap-highlight-color:transparent}'+
  '.hero .mascot.r{animation-delay:-2.5s}'+
  '@keyframes cbomb{0%,100%{transform:translateY(0) rotate(0)}20%{transform:translateY(-6px) rotate(-2deg)}40%{transform:translateY(0) rotate(0)}55%{transform:translateY(-3px) rotate(3deg)}70%{transform:translateY(0) rotate(-2deg)}85%{transform:translateY(-5px) rotate(0)}}'+
  '.hero .mascot.cbo-twirl{animation:cbotw .9s ease-in-out 1}'+
  '@keyframes cbotw{0%{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(1.12) translateY(-14px)}100%{transform:rotate(360deg) scale(1)}}'+
  '.hero .mascot.cbo-tip{animation:cbotp 1s ease-in-out 1}'+
  '@keyframes cbotp{0%{transform:rotate(0)}25%{transform:rotate(-12deg) translateY(-8px)}45%{transform:rotate(9deg) translateY(2px)}65%{transform:rotate(-7deg) translateY(-4px)}100%{transform:rotate(0)}}'+
  '#cbo-mh .m{animation:cbomh 2.8s ease-in-out infinite}'+
  '@keyframes cbomh{0%,100%{transform:rotate(-8deg) translateY(0)}50%{transform:rotate(-4deg) translateY(-7px)}}}'+
  '#cbo-mh{position:fixed;right:0;bottom:150px;z-index:9985;display:none;align-items:flex-end;pointer-events:none;font-family:inherit}'+
  '#cbo-mh.on{display:flex}'+
  '#cbo-mh .m{pointer-events:auto;width:70px;height:94px;margin-right:-24px;border:0;padding:0;cursor:pointer;background:center bottom/contain no-repeat;transform:rotate(-8deg);filter:drop-shadow(0 3px 5px rgba(0,0,0,.25));transition:opacity .4s,margin .25s;-webkit-tap-highlight-color:transparent}'+
  '#cbo-mh.sw .m{opacity:0}'+
  '#cbo-mh.open .m{margin-right:0}'+
  '#cbo-mh .b{pointer-events:auto;display:none;position:relative;max-width:178px;margin:0 6px 40px 0;padding:11px 12px 10px;background:#fff;border:2px solid #f3b6cd;border-radius:18px 18px 4px 18px;box-shadow:0 6px 18px rgba(0,0,0,.18);font-size:.86rem;line-height:1.3;font-weight:800;color:#3a2a35}'+
  '#cbo-mh.open .b{display:block}'+
  '#cbo-mh .b a{display:block;margin-top:8px;background:#25b866;color:#fff;text-decoration:none;text-align:center;padding:9px 10px;border-radius:999px;font-weight:800;font-size:.86rem}'+
  '#cbo-mh .x{position:absolute;top:-10px;left:-10px;width:24px;height:24px;border-radius:50%;border:0;background:#3a2a35;color:#fff;font-size:15px;line-height:24px;padding:0;cursor:pointer}';
  document.head.appendChild(st);

  /* hero mascots: tap tricks */
  document.addEventListener('click',function(e){
    var m=e.target&&e.target.closest&&e.target.closest('.hero .mascot'); if(!m)return;
    var c=m.classList.contains('r')?'cbo-tip':'cbo-twirl';
    m.classList.remove('cbo-twirl','cbo-tip'); void m.offsetWidth; m.classList.add(c);
    setTimeout(function(){ m.classList.remove(c); },1100);
  });

  /* floating helper */
  var mh=document.createElement('div'); mh.id='cbo-mh';
  mh.innerHTML='<div class="b" role="dialog" aria-label="Help"><button class="x" type="button" aria-label="Close">×</button>Need help choosing? 💗<br>Chat with us!<a target="_blank" rel="noopener">💬 WhatsApp</a></div><button class="m" type="button" aria-label="Need help choosing? Chat with us"></button>';
  document.body.appendChild(mh);
  var m=mh.querySelector('.m'), a=mh.querySelector('a'); a.href=wa;
  var cur='pink', closed=false, turn=0;
  try{ closed=sessionStorage.getItem('cbo-mh-x')==='1'; }catch(e){}
  function paint(w){ cur=w; m.style.backgroundImage='url("'+B[w]+'")'; }
  function gender(){ var p=document.querySelector('button[data-g][aria-pressed="true"]'); var g=p&&p.getAttribute('data-g'); return g==='girls'?'pink':g==='boys'?'blue':''; }
  function sync(){
    var g=gender(), want=g||cur;
    if(g&&g!==cur){ swap(g); }
  }
  function swap(w){ mh.classList.add('sw'); setTimeout(function(){ paint(w); mh.classList.remove('sw'); },350); cur=w; }
  paint('pink');
  setInterval(function(){
    if(mh.classList.contains('open'))return;
    var g=gender();
    if(g){ if(g!==cur)swap(g); }
    else { turn++; if(turn%4===0)swap(cur==='pink'?'blue':'pink'); }
  },2000);
  document.addEventListener('click',function(){ setTimeout(sync,60); });
  m.addEventListener('click',function(){ mh.classList.toggle('open'); });
  mh.querySelector('.x').addEventListener('click',function(e){ e.stopPropagation(); mh.classList.remove('open'); closed=true; mh.classList.remove('on'); try{sessionStorage.setItem('cbo-mh-x','1');}catch(x){} });
  var tick=false;
  function upd(){ tick=false; var y=window.pageYOffset||document.documentElement.scrollTop||0; mh.classList.toggle('on',!closed&&y>600); }
  window.addEventListener('scroll',function(){ if(!tick){ tick=true; requestAnimationFrame(upd); } },{passive:true});
  upd();
})();
</script>
</body></html>
